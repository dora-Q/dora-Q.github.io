<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pieChart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            position: relative;
            width: 500px;
            height: 500px;
        }
        .chart-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 7px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="pieChart"></canvas>
        <div class="chart-tooltip" id="chartTooltip"></div>
    </div>

    <script>
        const data = [
            { title: "apple", value: 0.24, color: "green" },
            { title: "三星", value: 0.26, color: "yellow" },
            { title: "华为", value: 0.13, color: "orange" },
            { title: "xxx", value: 0.17, color: "red" },
            { title: "小米", value: 0.08, color: "purple" },
            { title: "其他", value: 0.12, color: "cyan" }
        ];

        const ctx = document.getElementById('pieChart').getContext('2d');

        const pieChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: data.map(item => item.title),
                datasets: [{
                    data: data.map(item => item.value),
                    backgroundColor: data.map(item => item.color),
                    hoverOffset: 25
                }]
            },
            options: {
                plugins: {
                    tooltip: {
                        enabled: false
                    }
                }
            }
        });

        const tooltip = document.getElementById('chartTooltip');
        ctx.canvas.addEventListener('mousemove', (event) => {
            const activeElements = pieChart.getElementsAtEventForMode(event, 'nearest', { intersect: true }, false);
            if (activeElements.length > 0) {
                const element = activeElements[0];
                const datasetIndex = element.datasetIndex;
                const index = element.index;
                const item = data[index];

                tooltip.style.display = 'block';
                tooltip.style.left = `${event.pageX + 10}px`;
                tooltip.style.top = `${event.pageY - 10}px`;
                tooltip.innerHTML = `${item.title}: ${item.value * 100}%`;
            } else {
                tooltip.style.display = 'none';
            }
        });

        ctx.canvas.addEventListener('mouseout', () => {
            tooltip.style.display = 'none';
        });

    </script>
</body>
</html>
